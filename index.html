<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista do Mercado</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<section id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>🛒 Lista do Mercado</h1>
    <p class="login-subtitle">Entre com a conta da família</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="E-mail" required autocomplete="username">
      <input type="password" id="login-password" placeholder="Senha" required autocomplete="current-password">
      <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
      <p id="login-error" class="login-error"></p>
    </form>
  </div>
</section>

<!-- ===================== APP (só aparece logado) ===================== -->
<div id="app-root" class="hidden">

  <!-- Header Fixo -->
  <header class="app-header">
    <h1>🛒 Lista do Mercado</h1>
    <div class="header-actions">
      <span class="family-badge">Família</span>
      <button id="logout-btn" class="btn-logout" title="Sair">Sair</button>
    </div>
  </header>

  <!-- Input para Adicionar Item Extra -->
  <section class="quick-add">
    <input type="text" id="item-input" placeholder="Adicionar algo que faltou...">
    <button id="add-btn">Adicionar</button>
  </section>

  <!-- Container Principal com as Listas -->
  <main class="list-container">
    <h2>Falta Pegar (<span id="remaining-count">0</span>)</h2>
    <ul id="shopping-list" class="item-list"></ul>

    <div class="section-header">
      <h2>Já no Carrinho (<span id="checked-count">0</span>)</h2>
      <button id="clear-cart-btn" class="btn-text">Esvaziar Carrinho</button>
    </div>
    <ul id="checked-list" class="item-list checked-mode"></ul>
  </main>

  <!-- Rodapé Fixo para Inserir Valor Total -->
  <footer class="app-footer">
    <div class="finish-section">
      <label for="total-amount">Gasto Total da Compra (R$):</label>
      <div class="input-group">
        <input type="number" id="total-amount" placeholder="Ex: 250.00" step="0.01">
        <button class="btn-primary" id="finish-buy-btn">Salvar Compra</button>
      </div>
    </div>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
